name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write   # softprops/action-gh-release needs this to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            archive: tar.gz
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            archive: tar.gz
          - os: macos-latest
            label: macos-arm64
            archive: tar.gz
          - os: windows-latest
            label: windows-x64
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout flutterbug-terps
        uses: actions/checkout@v4
        with:
          path: flutterbug-terps

      - name: Checkout garglk
        uses: actions/checkout@v4
        with:
          repository: garglk/garglk
          path: garglk

      # TODO: drop the `ref:` once curiousdannii/remglk-rs#13 (c_char fix) lands
      # and switch back to upstream curiousdannii/remglk-rs.
      - name: Checkout remglk-rs
        uses: actions/checkout@v4
        with:
          repository: joelburton/remglk-rs
          ref: fix-aarch64-c-char
          path: remglk-rs

      - name: Checkout games
        uses: actions/checkout@v4
        with:
          repository: joelburton/flutterbug-terps-games
          token: ${{ secrets.GAMES_TOKEN }}
          path: games

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            remglk-rs/target
          key: ${{ matrix.label }}-cargo-${{ hashFiles('remglk-rs/Cargo.lock', 'remglk-rs/**/Cargo.toml') }}
          restore-keys: ${{ matrix.label }}-cargo-

      - name: Set up MSVC env (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # macOS lacks GNU `timeout`, which smoke.sh uses as a safety wrapper
      # around each terp. brew's coreutils provides unprefixed GNU tools
      # under libexec/gnubin.
      - name: Install GNU coreutils (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install coreutils
          echo "/opt/homebrew/opt/coreutils/libexec/gnubin" >> $GITHUB_PATH

      # Windows uses the default shell (pwsh) for cmake/cargo invocations.
      # `shell: bash` on Windows is git-bash, which puts /usr/bin in front of
      # MSVC's bin dir — so cargo picks /usr/bin/link.exe (GNU coreutils,
      # totally unrelated tool) instead of MSVC's link.exe and Rust crates
      # fail to link.

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -B build -S flutterbug-terps

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -S flutterbug-terps -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build
        run: cmake --build build -j

      - name: Smoke test
        shell: bash
        run: flutterbug-terps/tests/smoke.sh -b "$PWD/build" -g "$PWD/games"

      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p dist
          TERPS="bocfel glulxe git tadsr scott plus taylor magnetic level9 agility jacl alan2 scare alan3 advsys hugo"
          mkdir staging
          for t in $TERPS; do
            if [ "${{ runner.os }}" = "Windows" ]; then
              cp "build/$t.exe" staging/
            else
              cp "build/$t" staging/
            fi
          done
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd staging && 7z a "../dist/flutterbug-terps-${{ matrix.label }}.zip" .)
          else
            tar -C staging -czf "dist/flutterbug-terps-${{ matrix.label }}.tar.gz" .
          fi

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
